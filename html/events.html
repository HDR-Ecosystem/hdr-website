<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/events.css" />
    <link rel="icon" href="../images/icon.png" />
</head>

<body>
    
    <div id="header-placeholder"></div>

    <div class="header-banner">
        <img src="../images/NSF_HDR_hero_section.png" alt="Gradient Background" class="background-image" />
        <div class="header-title-box">
            <h1 class="header-title">Events</h1>
            <p class="events-banner-subtitle">Explore upcoming and past events from the HDR Ecosystem, including workshops, hackathons, and conferences.</p>
        </div>
    </div>

    <main class="events-container">
        <section class="events-intro">
        </section>

        
        <div class="events-controls">
            <div class="search-filter-wrapper">
                <div class="search-box">
                    <img src="../images/search.png" alt="Search" class="search-icon-img" />
                    <input 
                        type="text" 
                        id="eventSearch" 
                        class="search-input" 
                        placeholder="Search events"
                    />
                </div>

                <div class="filter-button-wrapper">
                    <button class="filter-btn-main" id="filterToggle">
                        <img src="../images/Vector.png" alt="Filter" />
                        Filter
                    </button>

                    <div class="filter-dropdown hidden" id="filterDropdown">
                        <div class="filter-options">
                            <div class="filter-group-title">Event Type</div>
                            <label class="filter-option">
                                <input type="radio" name="eventFilter" value="all" checked />
                                <span>All Events</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="eventFilter" value="upcoming" />
                                <span>Upcoming Events</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="eventFilter" value="past" />
                                <span>Past Events</span>
                            </label>
                            
                            <div class="filter-group-title">Format</div>
                            <label class="filter-option">
                                <input type="radio" name="eventFormat" value="all" checked />
                                <span>Any Format</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="eventFormat" value="virtual" />
                                <span>Virtual</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="eventFormat" value="in-person" />
                                <span>In-person</span>
                            </label>
                            
                            <div class="filter-group-title">Institute</div>
                            <label class="filter-option">
                                <input type="checkbox" name="instituteFilter" value="A3D3" />
                                <span>A3D3</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="instituteFilter" value="I-GUIDE" />
                                <span>I-GUIDE</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="instituteFilter" value="ID4" />
                                <span>ID4</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="instituteFilter" value="iHARP" />
                                <span>iHARP</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="instituteFilter" value="Imageomics" />
                                <span>Imageomics</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        

        <section class="events-list">
            <div class="events-grid" id="eventsGrid">
                
            </div>

            <div class="no-events hidden" id="noEvents">
                <p>No events found matching your search.</p>
            </div>
        </section>

        <section class="pagination-section">
            <div class="pagination" id="pagination">
                
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>    <script src="../js/load-components.js"></script>


    <script src="../js/script.js"></script>
    <script src="../js/events.js"></script>
</body>
</html>
