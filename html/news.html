<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/news.css" />
    <link rel="icon" href="../images/nsf-logo.png" />
</head>
<body>
    
    <div id="header-placeholder"></div>

    <div class="header-banner">
        <img src="../images/NSF_HDR_hero_section.png" alt="Gradient Background" class="background-image" />
        <div class="header-title-box">
            <h1 class="header-title">News</h1>
            <p class="header-banner-subtitle">Discover announcements and updates from across the NSF HDR Ecosystem.</p>
        </div>
    </div>

    <section class="news-and-updates">
        <div class="news-container" id="news-container">
            
        </div>
        <div class="pagination" id="pagination">
            
        </div>
        
        
        <div class="submit-news-section">
            <p class="submit-news-text">
                Have something exciting to share with the HDR ecosystem?  
                Submit your news, announcements, or event highlights using the form below.
            </p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeSFBy11ZEW54qN_cBkSHD6moPfjrOE10ixIAu6d3YbqY1yjA/viewform?usp=header" target="_blank" class="submit-news-btn">Submit News</a>
        </div>
    </section>

    
    <div id="footer-placeholder"></div>    <script src="../js/load-components.js"></script>


    

    <script src="../js/script.js"></script>
    <script src="../js/news-data.js"></script>
    <script src="../js/news.js"></script>
</body>
</html>
